name: BrainMelter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Evaluate the flake (packages, apps, NixOS module)
        run: nix flake check
      - name: Build the packages
        run: nix build --print-build-logs .#web .#irc-input
